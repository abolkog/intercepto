name: 🐛 Bug Report
description: Report something that isn't working as expected
title: 'fix: <short description>'
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Create a rule matching '...'
        2. Enable the rule
        3. Open a page that requests '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: input
    id: extension-version
    attributes:
      label: Intercepto version
      placeholder: e.g. 1.4.2
    validations:
      required: true

  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: e.g. 128.0.6613.120
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console logs
      description: If applicable, add screenshots or console output to help explain the problem.
    validations:
      required: false
